[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kindergarden"
version = "0.2.2"
description = "A robotics benchmark for physical reasoning."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
   "Programming Language :: Python :: 3",
   "License :: OSI Approved :: MIT License",
   "Operating System :: OS Independent",
]
dependencies = [
   "gymnasium",
   "matplotlib",
   "numpy",
   "Pillow",
   "dill",
   "shapely>=2.1.2",
   "scipy>=1.14.0",
   "relational_structs>=0.0.1",
   "prpl_utils>=0.0.1",
   "pygame>=2.5.2",
   "pymunk==7.1.0",
   "mujoco~=3.3.0",
   "opencv-python>=4.9.0",
   "gdown>=6.0.0",
   "pybullet-arm64>=3.2.8",
   "tomsgeoms2d>=0.0.1",
   "pybullet_helpers>=0.1.0",
]

[project.optional-dependencies]
# The kinematic3d_v2 environments. prpl_kinematics is kept optional because it overlaps
# heavily with pybullet_helpers (both model robots, IK, and motion planning) and both are
# large, so a base install should not pull in the pair.
prpl-kinematics = [
   "prpl_kinematics>=0.0.1",
]
pointcloud = [
   "h5py>=3",
   "open3d>=0.19.0",
   "pyqt5>=5.15.11",
   "trimesh>=4.0.0",
]
develop = [
   # Optional for users (see the prpl-kinematics extra), but installed for development
   # and CI so the kinematic3d_v2 environments are linted, type checked, and tested.
   "prpl_kinematics>=0.0.1",
   "pygame>=2.5.2",
   "pymunk==7.1.0",
   "mujoco~=3.3.0",
   "opencv-python>=4.9.0",
   "pybullet-arm64>=3.2.8",
   "tomsgeoms2d>=0.0.1",
   "pybullet_helpers>=0.1.0",
   "h5py>=3",
   "black[jupyter]",
   "docformatter",
   "isort",
   "mypy",
   "pylint>=2.14.5",
   "pytest-pylint>=0.18.0",
   # pytest 9.1 dropped the `path` arg from the pytest_collect_file hookspec,
   # which pytest-pylint 0.21.0 still uses -- it crashes the lint job. Temporary
   # cap; see issue #111 for the proper fix.
   "pytest>=7.2.2,<9.1",
   "coverage",
   "gdown>=6.0.0",
   "scipy-stubs>=1.15.3.0",
   "types-shapely>=2.1.0",
   "nbmake",
   "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinder = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "pygame.*",
    "dill.*",
    "mujoco.*",
    "cv2.*",
    "pybullet.*",
    "gdown.*",
    "h5py.*",
    "open3d.*",
    "trimesh.*",
    # Optional; see the prpl-kinematics extra.
    "prpl_kinematics.*",
    "spatialmath.*",
]
ignore_missing_imports = true

[tool.coverage.run]
relative_files = true
source = ["src", "tests"]
